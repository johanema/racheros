<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Racheros Admin{% endblock %}</title>

    <link rel="icon" href="{{ url_for('static', filename='icono.ico') }}" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Fonts & Icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- DataTables CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css"
    />

    <style>
      :root {
        /* --- PALETA NEUMÓRFICA CLARA (Default) --- */
        --neu-bg: #e0e5ec;
        --neu-text: #4a5568;
        --neu-shadow-light: #ffffff;
        --neu-shadow-dark: #a3b1c6;
        --primary-color: #6366f1;
        --sidebar-width: 260px;
        --chart-grid-color: rgba(0, 0, 0, 0.05);
      }

      [data-bs-theme="dark"] {
        /* --- PALETA NEUMÓRFICA OSCURA --- */
        --neu-bg: #2c3036;
        --neu-text: #bdc1c6;
        --neu-shadow-light: #383c44;
        --neu-shadow-dark: #202328;
        --primary-color: #818cf8;
        --chart-grid-color: rgba(255, 255, 255, 0.05);
      }

      body {
        font-family: "Nunito", sans-serif;
        background-color: var(--neu-bg);
        color: var(--neu-text);
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      /* --- SIDEBAR --- */
      .admin-sidebar {
        width: var(--sidebar-width);
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        background: var(--neu-bg);
        z-index: 1000;
        transition: transform 0.3s ease;
        box-shadow: 6px 0 10px var(--neu-shadow-dark);
        border: none;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }

      .sidebar-header {
        padding: 2rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 15px;
        flex-shrink: 0;
      }

      .sidebar-logo {
        width: 38px;
        filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.2));
      }

      .sidebar-nav-container {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        /* justify-content: space-between; */
        padding-bottom: 2rem;
      }

      .nav-link-admin {
        margin: 0.5rem 1rem;
        padding: 0.8rem 1.5rem;
        color: var(--neu-text);
        border-radius: 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.2s ease;
        border: 1px solid transparent;
      }

      .nav-link-admin:hover {
        color: var(--primary-color);
        transform: translateY(-2px);
        box-shadow: 5px 5px 10px var(--neu-shadow-dark),
          -5px -5px 10px var(--neu-shadow-light);
      }

      .nav-link-admin.active {
        color: var(--primary-color);
        background-color: var(--neu-bg);
        box-shadow: inset 5px 5px 8px var(--neu-shadow-dark),
          inset -5px -5px 8px var(--neu-shadow-light);
      }

      /* --- CONTENIDO PRINCIPAL (La parte que faltaba) --- */
      .main-content {
        margin-left: var(--sidebar-width);
        padding: 2.5rem;
        min-height: 100vh;
        transition: margin-left 0.3s ease;
        background-color: var(--neu-bg); /* Asegura fondo correcto */
      }

      /* --- UI ELEMENTS --- */
      .theme-toggle-btn {
        background: var(--neu-bg);
        border-radius: 50%;
        width: 45px;
        height: 45px;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--neu-text);
        cursor: pointer;
        box-shadow: 5px 5px 10px var(--neu-shadow-dark),
          -5px -5px 10px var(--neu-shadow-light);
        transition: all 0.2s;
      }

      .theme-toggle-btn:active {
        box-shadow: inset 3px 3px 6px var(--neu-shadow-dark),
          inset -3px -3px 6px var(--neu-shadow-light);
      }

      /* --- RESPONSIVE / MOBILE --- */
      @media (max-width: 768px) {
        .admin-sidebar {
          transform: translateX(-100%);
        }
        .admin-sidebar.show {
          transform: translateX(0);
          box-shadow: 10px 0 20px rgba(0, 0, 0, 0.2);
        }
        .main-content {
          margin-left: 0;
          padding: 1rem;
        }
        .mobile-toggle {
          display: block !important;
        }
      }
      .mobile-toggle {
        display: none;
      }
    </style>
    {% block styles %}{% endblock %}
  </head>
  <body>
    <!-- Botón Toggle Móvil -->
    <button
      class="btn mobile-toggle position-fixed m-3"
      style="
        z-index: 1001;
        background: var(--neu-bg);
        color: var(--primary-color);
        box-shadow: 3px 3px 6px var(--neu-shadow-dark);
      "
      onclick="toggleSidebar()"
    >
      <i class="bi bi-list fs-4"></i>
    </button>

    <!-- SIDEBAR -->
    <nav class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-header">
        <!-- Puedes poner tu logo aquí -->
        <h5
          class="fw-bold m-0"
          style="color: var(--primary-color); letter-spacing: 0.5px"
        >
          <i class="fas fa-chart-line me-2"></i>Racheros<span
            style="opacity: 0.6; font-weight: 400"
            >Admin</span
          >
        </h5>
      </div>

      <div class="sidebar-nav-container">
        <!-- Bloque Menu -->
        <div class="mt-2">
          <p
            class="small text-uppercase px-4 mb-3 fw-bold"
            style="opacity: 0.5; font-size: 0.7rem; letter-spacing: 1px"
          >
            Menú Principal
          </p>

          <a
            href="{{ url_for('index') }}"
            class="nav-link-admin {% if request.endpoint == 'index' %}active{% endif %}"
          >
            <i class="bi bi-grid-1x2-fill"></i> Dashboard
          </a>
          <!-- Agrega más enlaces aquí si es necesario -->
        </div>

        <!-- Bloque Configuración y Logout (Fixed at bottom logic via flex-grow spacer if needed, or just margin-top auto) -->
        <div class="mt-auto pb-4">
          <p
            class="small text-uppercase px-4 mb-3 fw-bold"
            style="opacity: 0.5; font-size: 0.7rem; letter-spacing: 1px"
          >
            Configuración
          </p>

          <div
            class="px-4 mb-4 d-flex align-items-center justify-content-between"
          >
            <span class="fw-bold small">Modo Oscuro</span>
            <button class="theme-toggle-btn" id="themeToggleBtn">
              <i class="bi bi-moon-fill" id="themeIcon"></i>
            </button>
          </div>

          <a href="{{ url_for('logout') }}" class="nav-link-admin text-danger">
            <i class="bi bi-box-arrow-right"></i> Cerrar sesión
          </a>
        </div>
      </div>
    </nav>
    <!-- ÚLTIMOS CAMBIOS -->
    <!-- CONTENIDO PRINCIPAL (Esto faltaba y causaba que se viera amontonado) -->
    <main class="main-content">{% block content %}{% endblock %}</main>

    <!-- Scripts Base -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Lógica de Modo Oscuro y Sidebar -->
    <script>
      // 1. Lógica del Sidebar Móvil
      function toggleSidebar() {
        document.getElementById("adminSidebar").classList.toggle("show");
      }

      // 2. Lógica del Modo Oscuro
      document.addEventListener("DOMContentLoaded", () => {
        const html = document.documentElement;
        const toggleBtn = document.getElementById("themeToggleBtn");
        const icon = document.getElementById("themeIcon");

        // Función para aplicar tema
        function setTheme(theme) {
          html.setAttribute("data-bs-theme", theme);
          localStorage.setItem("theme", theme);

          // Actualizar icono
          if (theme === "dark") {
            icon.classList.remove("bi-sun-fill");
            icon.classList.add("bi-moon-fill");
          } else {
            icon.classList.remove("bi-moon-fill");
            icon.classList.add("bi-sun-fill");
          }
        }

        // Leer preferencia guardada
        const savedTheme = localStorage.getItem("theme") || "light";
        setTheme(savedTheme);

        // Event listener para el botón
        toggleBtn.addEventListener("click", () => {
          const currentTheme = html.getAttribute("data-bs-theme");
          const newTheme = currentTheme === "dark" ? "light" : "dark";
          setTheme(newTheme);

          // Disparar evento para que Charts.js se actualice si es necesario
          window.dispatchEvent(new Event("themeChanged"));
        });
      });
    </script>

    {% block scripts %}{% endblock %}
  </body>
</html>
