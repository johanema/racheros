<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Racheros{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='icono.ico') }}" />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Iconos de Bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <style>
      /* Estilo base para la app */
      :root {
        --neumorphic-bg-light: #e0e5ec;
        --neumorphic-bg-dark: #2c3036;
        --neumorphic-text-light: #5b626d;
        --neumorphic-text-dark: #bdc1c6;
        --neumorphic-shadow-light-1: #ffffff;
        --neumorphic-shadow-light-2: #a3b1c6;
        --neumorphic-shadow-dark-1: #383c44;
        --neumorphic-shadow-dark-2: #202328;
        --racheros-orange: #ea580c;
        --racheros-cyan: #22d3ee;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--neumorphic-bg-light);
        color: var(--neumorphic-text-light);
        transition: background-color 0.3s ease, color 0.3s ease;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      [data-bs-theme="dark"] body {
        background-color: var(--neumorphic-bg-dark);
        color: var(--neumorphic-text-dark);
      }

      /* Theme Switch Container - Fixed position */
      .theme-switch-wrapper {
        position: fixed;
        top: 1.5rem;
        right: 1.5rem;
        z-index: 1000;
        display: flex;
        align-items: center;
        padding: 0.75rem 1rem;
        border-radius: 50px;
        background: var(--neumorphic-bg-light);
        box-shadow: 6px 6px 12px var(--neumorphic-shadow-light-2),
          -6px -6px 12px var(--neumorphic-shadow-light-1);
      }

      [data-bs-theme="dark"] .theme-switch-wrapper {
        background: var(--neumorphic-bg-dark);
        box-shadow: 6px 6px 12px var(--neumorphic-shadow-dark-2),
          -6px -6px 12px var(--neumorphic-shadow-dark-1);
      }

      .theme-icon {
        color: var(--neumorphic-text-light);
        font-size: 1.1rem;
      }

      [data-bs-theme="dark"] .theme-icon {
        color: var(--neumorphic-text-dark);
      }

      .theme-switch {
        display: inline-block;
        height: 20px;
        position: relative;
        width: 40px;
        margin: 0 0.5rem;
      }

      .theme-switch input {
        display: none;
      }

      .slider {
        background-color: #ccc;
        bottom: 0;
        cursor: pointer;
        left: 0;
        position: absolute;
        right: 0;
        top: 0;
        transition: 0.4s;
      }

      .slider:before {
        background-color: #fff;
        bottom: 2px;
        content: "";
        height: 16px;
        left: 2px;
        position: absolute;
        transition: 0.4s;
        width: 16px;
      }

      input:checked + .slider {
        background-color: var(--racheros-orange);
      }

      input:checked + .slider:before {
        transform: translateX(20px);
      }

      .slider.round {
        border-radius: 34px;
      }

      .slider.round:before {
        border-radius: 50%;
      }
    </style>

    <!-- Bloque para estilos específicos de cada página -->
    {% block styles %}{% endblock %}
  </head>
  <body>
    <!-- Theme Switch - Only UI element on auth pages -->
    <div class="theme-switch-wrapper">
      <i class="bi bi-sun theme-icon"></i>
      <div class="theme-switch">
        <input type="checkbox" id="theme-checkbox" />
        <label for="theme-checkbox" class="slider round"></label>
      </div>
      <i class="bi bi-moon theme-icon"></i>
    </div>

    <!-- Contenido principal de la página -->
    <main class="flex-grow-1 d-flex align-items-center">
      {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const checkbox = document.getElementById("theme-checkbox");
        const htmlElement = document.documentElement;

        function setTheme(theme) {
          htmlElement.setAttribute("data-bs-theme", theme);
          localStorage.setItem("theme", theme);
          checkbox.checked = theme === "dark";
        }

        const savedTheme =
          localStorage.getItem("theme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        setTheme(savedTheme);

        checkbox.addEventListener("change", () => {
          setTheme(checkbox.checked ? "dark" : "light");
        });
      });
    </script>

    <!-- Bloque para scripts específicos de cada página -->
    {% block scripts %}{% endblock %}
  </body>
</html>
